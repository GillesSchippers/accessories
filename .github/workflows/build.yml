name: build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        java: [21]
        os: [ubuntu-22.04]

    steps:
      - name: checkout accessories
        uses: actions/checkout@v4
        with:
          path: accessories

      - name: checkout owo-lib
        uses: actions/checkout@v4
        with:
          repository: GillesSchippers/owo-lib
          path: owo-lib

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: publish owo-lib to Maven Local
        working-directory: owo-lib
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: build accessories
        working-directory: accessories
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: capture owo-lib artifacts
        if: runner.os == 'Linux' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: owo-lib-artifacts
          path: owo-lib/build/libs/

      - name: capture accessories artifacts
        if: runner.os == 'Linux' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: accessories-artifacts
          path: accessories/build/libs/
